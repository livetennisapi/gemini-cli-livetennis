name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate gemini-extension.json
        run: |
          jq -e '.name and .version and .author and .mcpServers.livetennis.command and .contextFileName' gemini-extension.json
          test -f "$(jq -r '.contextFileName' gemini-extension.json)"
      - name: Truthcheck
        run: sh scripts/truthcheck.sh
